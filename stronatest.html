<title>Strona główna</title>
<style>

body {
  padding: 0; /* Poprawiono: był średnik zamiast dwukropka */
  margin: 0;
  overflow: hidden;
  background: url('https://wallpaperaccess.com/full/90278.jpg');
  background-size: cover; 
  background-repeat: no-repeat; 
  background-attachment: fixed;
}

/* GŁÓWNY KONTENER MENU: Teraz na samej górze i wycentrowany */
.site-nav {
  position: absolute; 
  top: 0; /* Zmieniono z 50% na 0, aby menu było na samej górze */
  left: 50%;
  transform: translateX(-50%); /* Zmieniono translate: centrujemy tylko w poziomie */
  
  display: flex;
  flex-direction: column; /* Układ pionowy, aby zawartość szła w dół */
  align-items: center;
  padding: 10px;
  box-sizing: border-box;
  width: max-content; 
  min-width: 100%; 
  background: #4a4d6d;
  z-index: 100;
}

.side-menu-trigger {
  border: 0;
  border-radius: 5px;
  background: #ffffff; /* Dodano brakujący średnik */
  margin: auto;
  cursor: pointer;
}

.test {
  height: 50px; /* Zmniejszono wysokość przycisku bazowego */
  width: 300px;
  font-size: 20px;
  font-weight: bold;
}

/* ROZWIJANA LISTA: Teraz chowa się/pokazuje pod przyciskiem */
.side-menu {
  display: none; /* Domyślnie ukryte */
  box-sizing: border-box;
  width: 100%;
  padding: 0;
  background: #31334b; /* Zmieniono tło, aby pasowało do site-nav */
  margin-top: 10px;
}

.side-menu ul {
  display: flex;
  flex-direction: column; /* Elementy listy jeden pod drugim */
  width: 98%;
  margin: auto;
  padding: 10px;
  list-style-type: none;
}

.side-menu ul li {
  display: flex;
  height: 40px;
  background: #ffffff;
  margin-bottom: 10px; /* Margines na dole zamiast na górze */
  color: #696e9e;
  border-radius: 5px;
  overflow: hidden;
  width: 100%;

}

.side-menu ul li:last-child {
  margin-bottom: 0; /* Usunięcie marginesu dla ostatniego elementu */
}

.side-menu ul li a {
  display: flex;
  padding: 10px;
  align-items: center;
  width: 100%;
  height: 100%;
  background: #ffffff;
  text-decoration: none;
  box-sizing: border-box;
  color: #696e9e;
  align-items: center;     /* Centrowanie w pionie (oś Y) */
  justify-content: center; /* NOWOŚĆ: Centrowanie w poziomie (oś X) */
}

/* AKCJA ROZWIJANIA: Pokazuje menu po kliknięciu/skupieniu na przycisku lub najechaniu */
.side-menu-trigger:focus ~ .side-menu, 
.side-menu:hover {
  display: block; /* Pokazuje menu w dół */
}

li a, li a:visited {
  text-decoration: none;
  color: #333;
}

li a:hover, li a:focus{
  background: #333;
  color: whitesmoke;
}

.video-tlo {
position: fixed;
  top: 50%;
  left: 50%;
  min-width: 100%;
  min-height: 100%;
  width: auto;
  height: auto;
  z-index: -1;
  object-fit: cover;
  transform: translate(-50%, -50%)
}

</style>
  <title>
    Rozsuwane menu boczne w samym CSS 
  </title>
</head>
<body>
