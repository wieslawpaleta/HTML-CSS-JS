<title>Strona główna</title>
<style>

body {
  padding: 0;
  margin: 0;
  overflow: hidden;
  background: url('https://wallpaperaccess.com/full/90278.jpg');
  background-size: cover; 
  background-repeat: no-repeat; 
  background-attachment: fixed;
}


.site-nav {
  position: absolute; 
  top: 0;
  left: 50%;
  transform: translateX(-50%); 
  
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px;
  box-sizing: border-box;
  width: max-content; 
  min-width: 100%; 
  background: #4a4d6d;
  z-index: 100;
}

.side-menu-trigger {
  border: 0;
  border-radius: 5px;
  background: #ffffff; 
  margin: auto;
  cursor: pointer;
}

.test {
  height: 50px;
  width: 300px;
  font-size: 20px;
  font-weight: bold;
}


.side-menu {
  display: none; 
  box-sizing: border-box;
  width: 100%;
  padding: 0;
  background: #31334b;
  margin-top: 10px;
}

.side-menu ul {
  display: flex;
  flex-direction: column; 
  width: 98%;
  margin: auto;
  padding: 10px;
  list-style-type: none;
}

.side-menu ul li {
  display: flex;
  height: 40px;
  background: #ffffff;
  margin-bottom: 10px; 
  color: #696e9e;
  border-radius: 5px;
  overflow: hidden;
  width: 100%;

}

.side-menu ul li:last-child {
  margin-bottom: 0; 
}

.side-menu ul li a {
  display: flex;
  padding: 10px;
  align-items: center;
  width: 100%;
  height: 100%;
  background: #ffffff;
  text-decoration: none;
  box-sizing: border-box;
  color: #696e9e;
  align-items: center;  
  justify-content: center; 
}


.side-menu-trigger:focus ~ .side-menu, 
.side-menu:hover {
  display: block;
}

li a, li a:visited {
  text-decoration: none;
  color: #333;
}

li a:hover, li a:focus{
  background: #333;
  color: whitesmoke;
}

.video-tlo {
position: fixed;
  top: 50%;
  left: 50%;
  min-width: 100%;
  min-height: 100%;
  width: auto;
  height: auto;
  z-index: -1;
  object-fit: cover;
  transform: translate(-50%, -50%)
}

</style>
  <title>
    Rozsuwane menu boczne w samym CSS 
  </title>
</head>
